{% extends "base.html" %}
{% load static %}

{% block content %}
    <section class="about_section layout_padding">
    <div class="container">
        <div class="heading_container">
        <h2>
            About
        </h2>
        </div>
        <div class="box layout_padding2-top layout_padding-bottom">
        <div class="detail-box">
            <p style="text-align: justify;" >
                {{site.about}}
            </p>
        </div>
        <div class="img-box">
            <img src="{% static 'images/about-img.jpg' %}" alt="">
        </div>
        </div>
    </div>
    <div class="btn-box">
        <div >
        {{site.address}}  |  {{site.email}}  |   {{site.telephone}} 
        </div>
    </div>
    </section>


{% endblock  %}
