{% extends "base.html" %}

{% block content %}

<section class="contact_section layout_padding">
    <div class="container">
        <div class="heading_container">
            <h2>Contact Us</h2>
        </div>

        <div class="contact-form">
            <form action="{% url 'ContactUs' %}" method="POST">
                {% csrf_token %}

                {{ form.full_name }}
                {{ form.phone_number }}
                {{ form.email }}
                {{ form.message }}

                <button type="submit" class="btn_on-hover">
                    Send
                </button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
